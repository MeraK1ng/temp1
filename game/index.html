<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>霓虹躲避 Neon Dodge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; }
    body {
      display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    #stage {
      position: relative;
      width: 480px; height: 720px;
      border-radius: 14px;
      box-shadow: 0 0 0 2px #23233a, 0 20px 60px rgba(0,0,0,.6);
      overflow: hidden;
      background: #0e0e1c;
    }
    canvas { display: block; }
    #hud {
      position: absolute; top: 14px; left: 0; right: 0;
      display: flex; justify-content: space-between; padding: 0 20px;
      color: #9be7ff; font-size: 15px; font-weight: 600;
      pointer-events: none; letter-spacing: .5px;
    }
    #hud .label { color: #5b5b78; font-weight: 500; }
    #overlay {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; text-align: center; color: #e8f6ff;
      background: rgba(10,10,20,.82); backdrop-filter: blur(3px);
    }
    #overlay h1 { font-size: 30px; letter-spacing: 2px; color: #7de6ff; text-shadow: 0 0 18px rgba(125,230,255,.5); }
    #overlay p { color: #9aa0b8; font-size: 14px; line-height: 1.7; }
    #overlay .score-final { font-size: 22px; color: #ffd76a; }
    #overlay .best { font-size: 13px; color: #6f748c; }
    #startBtn {
      margin-top: 6px; padding: 13px 42px; font-size: 17px; font-weight: 700;
      color: #08131c; background: linear-gradient(135deg,#7de6ff,#4aa8ff);
      border: none; border-radius: 30px; cursor: pointer; letter-spacing: 1px;
      transition: transform .08s ease, box-shadow .2s ease;
      box-shadow: 0 6px 22px rgba(74,168,255,.45);
    }
    #startBtn:hover { transform: translateY(-1px); }
    #startBtn:active { transform: translateY(1px) scale(.98); }
    .hint { font-size: 12px; color: #5b5b78; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="720"></canvas>
    <div id="hud">
      <span><span class="label">得分 </span><span id="score">0</span></span>
      <span><span class="label">最佳 </span><span id="best">0</span></span>
    </div>
    <div id="overlay">
      <h1>霓虹躲避</h1>
      <div class="score-final"></div>
      <div class="best"></div>
      <p>← → 或 A D 左右移动　·　空格 / ↑ 跳跃<br>躲开下落的障碍，吃到星星加分</p>
      <button id="startBtn">开始游戏</button>
      <div class="hint">难度会随得分提升，撞到即结束</div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
